name: SonarCloud

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    name: Build and analyze (skip GUI & Selenium UI tests)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Necessario per analisi completa Sonar (history + blame)

      - name: Setup Java 19 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 19
          cache: maven

      # (Facoltativo) Installazione Chrome/Chromium (puoi anche rimuoverlo se non serve ora)
      - name: Install Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser || sudo apt-get install -y chromium
          which chromium-browser || which chromium

      # Librerie native utili a JavaFX per evitare errori GTK / Glass
      - name: Install system libs for JavaFX
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-0 \
            libxtst6 \
            libxrender1 \
            libxi6 \
            libxxf86vm1 \
            libasound2 \
            libdbus-glib-1-2 || true

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache Maven local repo (extra)
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      # Build & Sonar con xvfb-run per fornire DISPLAY virtuale.
      - name: Build & Sonar (xvfb)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          MAVEN_OPTS: "-Djava.awt.headless=true -Dprism.order=sw"
        run: |
          sudo apt-get install -y xvfb
          # Se i test UI NON devono girare, assicurati che il profilo skip-ui-tests li escluda;
          # in caso contrario, aggiungi un -Dtest con esclusioni esplicite.
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
            mvn -B \
              -Pci-linux,skip-ui-tests \
              -DfailIfNoTests=false \
              verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
              -Dsonar.projectKey=Chiara183_Sportify2
