name: SonarCloud

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    name: Build and analyze (skip GUI & Selenium UI tests)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
            fetch-depth: 0  # Necessario per analisi completa Sonar (history + blame)

      - name: Setup Java 19 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 19
          cache: maven

      # (Facoltativo) Installazione minima di Chrome/Chromium se un domani riabiliti i test Selenium
      - name: Install Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser || sudo apt-get install -y chromium
          which chromium-browser || which chromium

      # Cache Sonar
      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # Cache Maven (usa già cache integrata setup-java, ma lasciamo anche questa se vuoi massima persistenza ~/.m2)
      - name: Cache Maven local repo (extra)
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      # Avvia server X virtuale
      - name: Start Xvfb
        run: |
          Xvfb :99 -screen 0 1920x1080x24 &
          echo "DISPLAY=:99" >> $GITHUB_ENV

      - name: Build & Sonar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          # Esegui Maven saltando i test che richiedono GUI o WebDriver.
          # Usa la sintassi Surefire 3.x con pattern negativi (!).
          mvn -B \
            -Pci-linux,skip-ui-tests \
            -DfailIfNoTests=false \
            verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=Chiara183_Sportify2
